<!DOCTYPE html>
<html lang="fr">
<head> 
  <meta charset="UTF-8" />
  <title>Prix spot du gaz en temps réel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600&display=swap" rel="stylesheet">

  <style>
    /* ✅ Le fond du body est transparent pour épouser votre site, mais l'alignement est préservé */
    html, body { margin:0; padding:0; background: transparent; }
    body {
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;
      justify-content:center;
      align-items: center;
      min-height: 100vh;
    }
    /* ✅ RETOUR DE LA BELLE BOÎTE BLANCHE AVEC SON OMBRE ET SES BORDS ARRONDIS */
    .chart-wrapper {
      background: #ffffff;      /* Fond blanc impeccable */
      border-radius: 16px;      /* Bords arrondis élégants */
      box-shadow: 0 8px 24px rgba(0,0,0,.06); /* Ombre douce et moderne */
      padding: 24px;
      width: 100%;
      max-width: 940px;
      margin: 10px auto;        /* Petite marge de sécurité pour ne pas coller */
      box-sizing: border-box;
    }
    /* ✅ FIX DU TITRE DÉCENTRÉ */
    h1 {
      margin: 0 0 6px;
      text-align: center !important; /* Force le centrage parfait */
      width: 100%;
      font-size: 22px;
      font-weight: 600;
      color: #0b0f19;
    }
    h3 {
      margin: 0 0 24px;
      text-align: center !important; /* Force le centrage parfait */
      width: 100%;
      font-size: 15px;
      font-weight: 400;
      color: #6b7280;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 420px; /* Légèrement ajusté pour laisser respirer les dates du bas */
    }
    #myChart {
      width: 100% !important;
      height: 100% !important;
    }
    @media (max-width: 640px){
      .chart-wrapper { padding: 16px; margin: 5px; }
      h1 { font-size: 18px; }
      h3 { font-size: 13px; margin-bottom: 16px; }
      .canvas-container { height: 300px; }
    }
  </style>
</head>

<body>
  <div class="chart-wrapper" id="wrap">
    <h1>Prix spot du gaz en temps réel</h1>
    <h3>Le graphique est mis à jour quotidiennement à 9h</h3>
    
    <div class="canvas-container">
      <canvas id="myChart" aria-label="Courbe des prix" role="img"></canvas>
    </div>
  </div>

  <script>
    const jsonUrl = "https://raw.githubusercontent.com/FEPPN/daily-gas-spot-price/main/data.json";

    const parseFrenchDate = (str) => {
      if (!str) return null;
      const parts = str.split('/');
      if (parts.length === 3) {
        return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
      }
      return null;
    };

    fetch(jsonUrl, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("Impossible de charger les données.");
        return r.json();
      })
      .then(rows => {
        let dataPoints = [];

        rows.forEach(r => {
          const rawDate = r['date'] || r['Date'];
          const rawVal = r['price'] || r['Price'] || r['withoutARENH'] || r['without_arenh'];
          
          if (!rawDate || !rawVal) return;

          let cleanVal = String(rawVal).replace(',', '.').replace(/[^\d.-]/g, '');
          const val = parseFloat(cleanVal);
          const dateObj = parseFrenchDate(String(rawDate).trim());

          if (dateObj && !isNaN(val)) {
            dataPoints.push({ date: dateObj, val: val, labelStr: rawDate });
          }
        });

        dataPoints.sort((a, b) => a.date - b.date);

        if (dataPoints.length === 0) {
          throw new Error("Données illisibles.");
        }

        const labels = dataPoints.map(p => p.labelStr);
        const values = dataPoints.map(p => p.val);

        const yMin = Math.min(...values);
        const yMax = Math.max(...values);
        const pad = (yMax - yMin) * 0.1 || 0.002;

        const ctx = document.getElementById('myChart').getContext('2d');
        if (window.chartInstance) { window.chartInstance.destroy(); }

        window.chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: "Prix",
              data: values,
              borderColor: "#5a52ff",
              borderWidth: 2.5,
              pointRadius: 0,
              tension: 0.1,
              fill: 'origin',
              backgroundColor: (c) => {
                const chartInstance = c.chart;
                const {ctx, chartArea} = chartInstance;
                if (!chartArea) return 'rgba(0,0,0,0)';
                const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                gradient.addColorStop(0, 'rgba(90, 82, 255, 0.25)');
                gradient.addColorStop(1, 'rgba(90, 82, 255, 0.00)');
                return gradient;
              }
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "#fff",
                borderColor: "#e5e7eb",
                borderWidth: 1,
                titleColor: "#111827",
                bodyColor: "#4b5563",
                padding: 12,
                cornerRadius: 10,
                callbacks: {
                  label: (c) => ` ${c.parsed.y.toFixed(2)} € / MWh`
                }
              }
            },
            scales: {
              y: {
                min: parseFloat((yMin - pad).toFixed(2)),
                max: parseFloat((yMax + pad).toFixed(2)),
                ticks: {
                  color: "#6b7280",
                  callback: v => `${Number(v).toFixed(2)} €`
                },
                grid: { color: "rgba(0, 0, 0, 0.04)" },
                border: { display: false }
              },
              x: {
                ticks: {
                  color: "#6b7280",
                  maxRotation: 0,
                  autoSkip: true,
                  maxTicksLimit: 6
                },
                grid: { display: false },
                border: { display: false }
              }
            }
          }
        });
      })
      .catch(err => {
        console.error(err);
      });
  </script>
</body>
</html>
