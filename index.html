<!DOCTYPE html>
<html lang="fr">
<head> 
  <meta charset="UTF-8" />
  <title>Historique des prédictions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600&display=swap" rel="stylesheet">

  <style>
    html, body { margin:0;  }
    body {
      background:#f9fafb;
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;
      justify-content:center;
    }
    .chart-wrapper {
      background:#fff;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:8px 16px;
      width:100%;
      max-width:940px;
      margin:0 auto;
    }
    h1 {
      margin:0 0 6px;
      text-align:center;
      font-size:22px;
      font-weight:600;
      color:#0b0f19;
    }
    h3 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 15px;
      font-weight: 400;
      color: #6b7280;
    }
    #myChart {
      display:block;
      width:100%;
      height:auto;
    }
    @media (max-width: 640px){
      body{ padding: 24px 12px 40px; }
      .chart-wrapper{ max-width: 100%; padding: 12px 14px; }
      h1{ font-size: 18px; line-height: 1.3; padding: 0 4px; }
      h3{ font-size: 13px; margin-bottom: 14px; padding: 0 6px; line-height: 1.35; }
      #myChart{ min-height: 260px; }
    }
  </style>
</head>

<body>
  <div class="chart-wrapper" id="wrap">
    <h1>Historique des prédictions du prix du kWh TTC au TRVE résidentiel en 2026</h1>
    <h3>Evolution de l'estimation depuis janvier 2025</h3>
    
    <canvas id="myChart" aria-label="Courbe des prix" role="img"></canvas>
  </div>

  <script>
    // Lien dynamique vers le fichier data.json qui sera mis à jour par GitHub
    const jsonUrl = "https://raw.githubusercontent.com/FEPPN/daily-gas-spot-price/main/data.json";

    const pick = (o, ks) => {
      for (const k of ks)
        if (o?.[k] !== undefined && o[k] !== null && o[k] !== "") return o[k];
    };
    
    const fmtDate = iso => {
      try {
        return new Date(iso).toLocaleDateString('fr-FR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });
      } catch { return String(iso ?? ""); }
    };

    let chart;

    function sizeCanvasOnce() {
      const wrap = document.getElementById('wrap');
      const cvs  = document.getElementById('myChart');
      const w = Math.floor(wrap.clientWidth);
      const h = 480;
      cvs.width = w;
      cvs.height = h;
      return cvs.getContext('2d');
    }

    fetch(jsonUrl, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(rows => {
        const isoDates = [], labels = [], values = [];
        
        rows.forEach(r => {
          // S'adapte automatiquement si vos colonnes s'appellent date, price ou sans ARENH
          const iso = pick(r, ["date", "Date", "dateISO"]);
          const val = Number(pick(r, ["price", "Price", "withoutARENH", "without_arenh"]));
          
          if (!iso || Number.isNaN(val)) return;
          isoDates.push(String(iso));
          labels.push(fmtDate(iso));
          values.push(val);
        });

        const yMin = Math.min(...values);
        const yMax = Math.max(...values);
        const pad = Math.max((yMax - yMin) * 0.06, 0.0005);

        const ctx = sizeCanvasOnce();
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "Prix",
              data: values,
              borderColor: "#5a52ff",
              borderWidth: 2.5,
              pointRadius: 0,
              tension: 0.28,
              fill: 'origin',
              backgroundColor: (c) => {
                const { chart } = c;
                const ca = chart.chartArea;
                if (!ca) return 'rgba(0,0,0,0)';
                const g = chart.ctx.createLinearGradient(0, ca.top, 0, ca.bottom);
                g.addColorStop(0, 'rgba(90,82,255,0.22)');
                g.addColorStop(1, 'rgba(90,82,255,0.00)');
                return g;
              }
            }]
          },
          options: {
            responsive: false,
            animation: false,
            interaction: { mode: 'nearest', intersect: false },
            plugins: {
              filler: { propagate: false },
              legend: { display: false },
              tooltip: {
                backgroundColor: "#fff",
                borderColor: "#e5e7eb",
                borderWidth: 1,
                titleColor: "#111827",
                bodyColor: "#4b5563",
                titleFont: { weight: '700' },
                bodyFont: { weight: '500' },
                padding: 10,
                cornerRadius: 10,
                callbacks: {
                  label: (c) => `${c.parsed.y.toFixed(4)} € / kWh TTC`
                }
              }
            },
            scales: {
              y: {
                suggestedMin: Math.floor((yMin - pad) * 1000) / 1000,
                suggestedMax: Math.ceil((yMax + pad) * 1000) / 1000,
                beginAtZero: false,
                ticks: {
                  color: "#6b7280",
                  precision: 4,
                  callback: v => `${Number(v).toFixed(4)} €`
                },
                grid: { color: "rgba(0,0,0,0.06)" },
                border: { display: false }
              },
              x: {
                ticks: {
                  color: "#6b7280",
                  maxRotation: 0,
                  autoSkip: true, // Évite la superposition des dates si elles sont nombreuses
                  maxTicksLimit: 8
                },
                grid: { display: false },
                border: { display: false }
              }
            }
          }
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('wrap').insertAdjacentHTML(
          "beforeend",
          `<p style="margin-top:8px;color:#ef4444;text-align:center">Erreur de chargement des données.</p>`
        );
      });
  </script>
</body>
</html>
