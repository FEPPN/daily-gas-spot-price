name: Synchronisation Google Sheet JSON

on:
  schedule:
    - cron: '0 6 * * *' # Tous les jours à 6h00 UTC
  workflow_dispatch: # Déclenchement manuel

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    # Cette ligne télécharge le CSV de votre Google Sheet et le convertit directement en fichier de données JSON propre
    - name: Telecharger les donnees Google Sheet
      run: |
        curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vT5K76P389E8qj0_zOorv_gM1H8_gI-rWhR9lG9E6_Tf7DszsLh6fMh-PzE8E4x1kOQv2L7U47Wq9b8/pub?output=csv" | python3 -c "import csv, json, sys; print(json.dumps(list(csv.DictReader(sys.stdin))))" > data.json

    - name: Sauvegarder data.json sur le dépôt
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions Bot"
        git add data.json
        git diff-index --quiet HEAD || (git commit -m "Mise à jour automatique des données JSON" && git push)

    # Déploiement instantané sur GitHub Pages
    - name: Configurer Pages
      uses: actions/configure-pages@v5

    - name: Televerser le site web
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deployer sur GitHub Pages
      uses: actions/deploy-pages@v4
