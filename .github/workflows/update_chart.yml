name: Routine de mise a jour du graphique

on:
  schedule:
    # S'exécute automatiquement TOUS LES JOURS à 06:00 UTC (soit 07h00 ou 08h00 en France selon l'heure d'été/hiver)
    - cron: '0 6 * * *'
  workflow_dispatch: # Cette ligne magique permet de déclencher la mise à jour manuellement quand on veut

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    # 1. Copie les fichiers du dépôt sur le serveur virtuel
    - name: Checkout du code
      uses: actions/checkout@v4

    # 2. Installe Python sur le serveur virtuel
    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Installe Pandas et Matplotlib
    - name: Installation des modules Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Lance le script qui télécharge le Google Sheet et crée 'graphique.png'
    - name: Creation du graphique
      run: python generate_chart.py

    # 5. Enregistre l'image créée et la renvoie sur votre dépôt GitHub
    - name: Sauvegarde de l'image sur GitHub
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions Bot"
        git add graphique.png
        # Permet de ne pas faire planter le script s'il n'y a aucune nouvelle donnée sur le Sheet
        git diff-index --quiet HEAD || (git commit -m "Mise à jour auto : nouveau graphique" && git push)
