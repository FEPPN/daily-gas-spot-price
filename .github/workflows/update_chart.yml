name: Synchronisation Google Sheet JSON

on:
  schedule:
    - cron: '0 7 * * *' # Tous les jours à 7h00 UTC soit 9h en FR
  workflow_dispatch: # Permet le déclenchement manuel

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Télécharger et Convertir la Google Sheet
      run: |
        echo "Début du téléchargement du CSV..."
        
        # Téléchargement du CSV brut depuis votre lien Google
        curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vRT_moHbxSD2GZ7lygIo_aXIXs5PlzD5WNNd8HuM6kz4_dc4YIO1Br9mx4yMkdfjVEasP1rrRwqO1Mi/pub?gid=1803115037&single=true&output=csv" > raw_data.csv
        
        echo "Contenu brut reçu (3 premières lignes) :"
        head -n 3 raw_data.csv
        
        # Conversion sécurisée en JSON avec un script Python robuste intégré
        python3 -c "
        import csv, json, sys
        try:
            with open('raw_data.csv', mode='r', encoding='utf-8-sig') as f:
                reader = csv.DictReader(f)
                # Nettoyage des espaces dans les noms de colonnes
                reader.fieldnames = [field.strip().lower() for field in reader.fieldnames if field]
                print('Colonnes nettoyées détectées :', reader.fieldnames)
                
                rows = []
                for row in reader:
                    # On ne garde que les lignes qui ont une date et un prix
                    clean_row = {k.strip(): v.strip() for k, v in row.items() if k and v}
                    if 'date' in clean_row or 'price' in clean_row:
                        rows.append(clean_row)
            
            print(f'Nombre de lignes lues avec succès : {len(rows)}')
            
            if len(rows) == 0:
                raise ValueError('Aucune ligne valide extraite du CSV.')
                
            with open('data.json', 'w', encoding='utf-8') as out:
                json.dump(rows, out, ensure_ascii=False, indent=2)
            print('Fichier data.json écrit avec succès !')
        except Exception as e:
            print('ERREUR DURANT LA CONVERSION :', str(e))
            sys.exit(1)
        "

    - name: Sauvegarder data.json sur le dépôt GitHub
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions Bot"
        git add data.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "Mise à jour automatique des données JSON"
          git push
        else
          echo "Aucune modification détectée dans les données."
        fi

    - name: Configurer Pages
      uses: actions/configure-pages@v5

    - name: Téléverser le site web
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Déployer sur GitHub Pages
      uses: actions/deploy-pages@v4
